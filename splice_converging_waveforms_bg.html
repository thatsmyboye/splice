
<canvas id="c" style="display:block;width:100%;height:520px;"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, dpr, raf;
let t = 0;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = canvas.offsetWidth;
  H = canvas.offsetHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}

function draw() {
  t += 0.004;

  ctx.clearRect(0, 0, W, H);

  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const bg       = isDark ? '#08080A' : '#f8f8fa';
  const waveA    = isDark ? [90, 140, 255]  : [40, 100, 220];   // blue — top waveform
  const waveB    = isDark ? [255, 180, 55]  : [200, 120, 20];   // amber — bottom waveform
  const splice   = isDark ? [180, 210, 255] : [60, 120, 255];   // vertical moment line
  const dotCol   = isDark ? [255, 190, 60]  : [200, 120, 20];
  const gridCol  = isDark ? 'rgba(255,255,255,0.035)' : 'rgba(0,0,0,0.05)';
  const labelCol = isDark ? 'rgba(255,255,255,0.18)' : 'rgba(0,0,0,0.18)';

  // Background
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Faint horizontal grid lines
  ctx.strokeStyle = gridCol;
  ctx.lineWidth = 0.5;
  const gridStep = H / 7;
  for (let y = gridStep; y < H; y += gridStep) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  // Vertical tick marks along bottom
  ctx.strokeStyle = gridCol;
  for (let x = 0; x < W; x += 60) {
    ctx.beginPath();
    ctx.moveTo(x, H - 20);
    ctx.lineTo(x, H - 10);
    ctx.stroke();
  }

  const spliceX = W * 0.58;
  const midY    = H * 0.5;

  // ---- Helper: draw one waveform ----
  // originY: vertical anchor
  // amplitude: max excursion in px
  // phaseOffset: time offset for animation
  // harmonics: array of {freq, weight, phase}
  // color: [r,g,b]
  // filled: draw filled waveform or just line
  function drawWave(originY, amplitude, phaseOffset, harmonics, color, filled) {
    const steps = Math.ceil(W * 1.5);
    const pts = [];

    for (let i = 0; i <= steps; i++) {
      const x = (i / steps) * W;
      const tx = x / W;

      let y = 0;
      for (const h of harmonics) {
        y += Math.sin(tx * h.freq * Math.PI * 2 + t * h.speed + h.phase + phaseOffset) * h.weight;
      }

      // Envelope: converge from both edges toward spliceX
      // Left waveform fans outward left of splice, right of splice = narrower
      const distFromSplice = Math.abs(x - spliceX) / W;
      const envelope = 0.15 + distFromSplice * 0.85;

      pts.push({ x, y: originY + y * amplitude * envelope });
    }

    if (filled) {
      // Filled waveform (alpha band around centerline)
      // Use two passes: positive and negative halves
      const alpha = 0.18;
      const rgb = color.join(',');

      ctx.beginPath();
      ctx.moveTo(pts[0].x, originY);
      for (const p of pts) ctx.lineTo(p.x, p.y);
      ctx.lineTo(W, originY);
      ctx.closePath();
      ctx.fillStyle = `rgba(${rgb},${alpha})`;
      ctx.fill();

      // Mirror (reflect around originY)
      ctx.beginPath();
      ctx.moveTo(pts[0].x, originY);
      for (const p of pts) ctx.lineTo(p.x, 2 * originY - p.y);
      ctx.lineTo(W, originY);
      ctx.closePath();
      ctx.fill();
    }

    // Top edge line
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.strokeStyle = `rgba(${color.join(',')},0.7)`;
    ctx.lineWidth = 1.2;
    ctx.stroke();

    // Bottom mirror line
    ctx.beginPath();
    ctx.moveTo(pts[0].x, 2 * originY - pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, 2 * originY - pts[i].y);
    ctx.stroke();
  }

  // Waveform A — coming from top, anchored at H*0.28 range, converging downward toward midY at spliceX
  // Actually: both waveforms share midY as their rest axis but their amplitudes compress to ~0 at spliceX
  // Waveform A = blue, top half dominant
  const harmonicsA = [
    { freq: 3.1, weight: 0.55, speed: 0.9,  phase: 0.0 },
    { freq: 7.3, weight: 0.25, speed: 1.6,  phase: 1.2 },
    { freq: 13.7, weight: 0.12, speed: 2.1, phase: 2.4 },
    { freq: 1.9, weight: 0.18, speed: 0.5,  phase: 0.8 },
  ];

  // Waveform B — amber, slightly different harmonics
  const harmonicsB = [
    { freq: 2.7, weight: 0.60, speed: 1.1,  phase: 1.7 },
    { freq: 6.1, weight: 0.22, speed: 1.8,  phase: 0.5 },
    { freq: 11.3, weight: 0.14, speed: 2.4, phase: 3.1 },
    { freq: 4.5, weight: 0.16, speed: 0.7,  phase: 2.0 },
  ];

  // Draw background ghost traces (very faint, wider)
  drawWave(midY, H * 0.22, 0,   harmonicsA, [waveA[0],waveA[1],waveA[2]], true);
  drawWave(midY, H * 0.22, 1.5, harmonicsB, [waveB[0],waveB[1],waveB[2]], true);

  // Second layer: slightly brighter, thinner
  drawWave(midY, H * 0.17, 0.3, harmonicsA, waveA, false);
  drawWave(midY, H * 0.17, 1.8, harmonicsB, waveB, false);

  // ---- Splice vertical line with soft glow ----
  // Soft passes
  for (const [offset, alpha] of [[10,0.025],[6,0.055],[3,0.11],[1,0.22],[0,0.75]]) {
    for (const dx of offset > 0 ? [-offset, offset] : [0]) {
      ctx.beginPath();
      ctx.moveTo(spliceX + dx, 0);
      ctx.lineTo(spliceX + dx, H);
      ctx.strokeStyle = `rgba(${splice.join(',')},${alpha})`;
      ctx.lineWidth = offset > 0 ? 1 : 1.2;
      ctx.stroke();
    }
  }

  // ---- Amber dot at splice × midY ----
  const dotR = 5;
  // Outer glow
  for (let r = 20; r > 0; r -= 2) {
    const a = ((1 - r/22) ** 1.5) * 0.4;
    ctx.beginPath();
    ctx.arc(spliceX, midY, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${dotCol.join(',')},${a})`;
    ctx.fill();
  }
  // Solid center
  ctx.beginPath();
  ctx.arc(spliceX, midY, dotR, 0, Math.PI * 2);
  ctx.fillStyle = `rgb(${dotCol.join(',')})`;
  ctx.fill();

  // ---- Minimal labels ----
  ctx.font = '11px monospace';
  ctx.fillStyle = labelCol;
  ctx.textAlign = 'left';

  // Timestamp at splice bottom
  ctx.textAlign = 'center';
  ctx.fillText('02:47', spliceX, H - 12);

  // "moment" label top
  ctx.fillText('selected moment', spliceX, 18);

  // Track label hints left edge
  ctx.textAlign = 'left';
  const trackLabels = ['·A', '·B'];
  ctx.fillText(trackLabels[0], 8, midY - H * 0.12);
  ctx.fillText(trackLabels[1], 8, midY + H * 0.14);

  raf = requestAnimationFrame(draw);
}

resize();
window.addEventListener('resize', () => { cancelAnimationFrame(raf); resize(); draw(); });
draw();
</script>
